# Render Blueprint for the Tydlii marketing site.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tydlii
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    # One instance. A disk cannot be shared, and it turns off zero-downtime
    # deploys so two versions never write the waitlist file at once.
    disk:
      name: waitlist
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public Web3Forms key. Inlined into the client bundle when the service builds.
      # Set this to the teamtydlii@gmail.com access key, then redeploy. Do not commit it.
      - key: NEXT_PUBLIC_WAITLIST_WEB3FORMS_ACCESS_KEY
        sync: false
      # Optional fallback if the public var is unset. The server does not call Web3Forms.
      - key: WAITLIST_WEB3FORMS_ACCESS_KEY
        sync: false
      # Optional. Best-effort JSON forward after a signup is confirmed. Not used for email.
      - key: WAITLIST_WEBHOOK_URL
        sync: false
      # Addresses already on the list. Must stay on the disk above.
      - key: WAITLIST_STORE_PATH
        value: /var/data/waitlist-emails.json
      # Optional. Comma-separated emails that joined before the file existed.
      - key: WAITLIST_SEED_EMAILS
        sync: false
      # Optional. Customer welcome email via Resend. Leave unset and signups still succeed.
      # Verify tydlii.com in Resend, then set both and redeploy (runtime env; no client rebuild).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
