# Render Blueprint for the Tydlii marketing site.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tydlii
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public Web3Forms key. Inlined into the client bundle when the service builds.
      # Set this to the teamtydlii@gmail.com access key, then redeploy. Do not commit it.
      - key: NEXT_PUBLIC_WAITLIST_WEB3FORMS_ACCESS_KEY
        sync: false
      # Optional fallback if the public var is unset. The server does not call Web3Forms.
      - key: WAITLIST_WEB3FORMS_ACCESS_KEY
        sync: false
      # Optional. Best-effort JSON forward from POST /api/waitlist. Not used for email.
      - key: WAITLIST_WEBHOOK_URL
        sync: false
