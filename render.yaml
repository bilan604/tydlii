# Render Blueprint for the Tydlii marketing site.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tydlii
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Web3Forms access key for teamtydlii@gmail.com. Set in the dashboard. Do not commit it.
      # When unset in production, the route logs the signup and returns 500.
      - key: WAITLIST_WEB3FORMS_ACCESS_KEY
        sync: false
      # Optional. Best-effort JSON forward after Web3Forms accepts the signup.
      - key: WAITLIST_WEBHOOK_URL
        sync: false
